# Default risk-scoring rules for Okshun. Higher score = higher risk.
# Same rule format as the `scoring:` section of config.example.yaml, so a
# rule you tune for the GoBid scraper can be copied here unchanged.
# Quote "yes"/"no": unquoted, YAML reads them as true/false.

run_and_drive:
  "yes": -5
  "no": 8
  unknown: 3

keys_available:
  "yes": -2
  "no": 4
  unknown: 1

odometer_status:
  actual: -1
  not_actual: 6
  exempt: 2
  unknown: 1

# Matched as a substring of the raw code text, first match wins, so list
# specific sub-codes (3A/3B/3C) before broader ones.
damage_code_points:
  "Code 2": -2
  "Code 3A": 0
  "Code 3B": 4
  "Code 3C": 7
  "Code 3": 4
  "Code 4": 10
damage_code_unknown_points: 2

damage_keywords:
  cosmetic:
    points: -2
    terms: [bumper, scratch, dent, hail, paint, panel, mirror, cosmetic, scrape, windscreen, glass]
  structural:
    points: 10
    terms: [frame, chassis, flood, flooded, fire, burnt, roof, airbag, engine, gearbox, transmission, structural, submerged, water damage]

mileage_thresholds:
  low_max: 80000
  low_points: -2
  high_min: 200000
  high_points: 3

bid_to_value_ratio:
  high_ratio_threshold: 0.75
  high_ratio_points: 4

thresholds:
  low_max: 0
  medium_max: 8
